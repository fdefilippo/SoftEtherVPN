name: Packages

# Builds DEB packages for Debian 13 and RPM packages for Enterprise Linux 8/9/10
# (built on Rocky Linux), for x86_64 and aarch64.
# Packages are uploaded as workflow artifacts; when a tag is pushed they are
# also attached to the GitHub release of that tag.

on:
  push:
    branches: [packages]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.distro.tag }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - { tag: debian-13,    image: 'debian:trixie',            family: deb }
          - { tag: el8,          image: 'rockylinux/rockylinux:8',  family: el, repo: powertools }
          - { tag: el9,          image: 'rockylinux/rockylinux:9',  family: el, repo: crb }
          - { tag: el10,         image: 'rockylinux/rockylinux:10', family: el, repo: crb }

    steps:
    - name: Install dependencies (DEB)
      if: matrix.distro.family == 'deb'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build gcc g++ make pkg-config \
          dpkg-dev file systemd libncurses-dev libreadline-dev libsodium-dev libssl-dev zlib1g-dev liblz4-dev libnl-genl-3-dev

    - name: Enable EPEL and ${{ matrix.distro.repo }} (EL)
      if: matrix.distro.family == 'el'
      run: |
        dnf install -y dnf-plugins-core epel-release
        dnf config-manager --set-enabled ${{ matrix.distro.repo }}

    - name: Install dependencies (RPM)
      if: matrix.distro.family == 'el'
      run: |
        dnf install -y git cmake ninja-build gcc gcc-c++ make pkgconf-pkg-config rpm-build file systemd \
          ncurses-devel readline-devel libsodium-devel openssl-devel zlib-devel lz4-devel libnl3-devel

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Build, install and test packages
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        .github/scripts/build-packages.sh ${{ matrix.distro.tag }} dist

    - uses: actions/upload-artifact@v7
      with:
        name: softether-${{ matrix.distro.tag }}-${{ matrix.arch }}
        path: dist/*
        if-no-files-found: error

  release:
    name: Attach packages to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Create release and upload packages
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd dist
        sha256sum * > SHA256SUMS
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "DEB and RPM packages built by the Packages workflow."
        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *
